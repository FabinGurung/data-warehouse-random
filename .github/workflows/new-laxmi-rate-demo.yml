name: New Laxmi Store catalogue QA and refresh
on:
  workflow_dispatch:
    inputs:
      products_csv:
        description: 'Approved products CSV from the Google Sheet (exact six headings)'
        required: false
        type: string
      catalogue_mode:
        description: 'Sample or reviewed publication'
        type: choice
        options: [SAMPLE, APPROVED]
        default: SAMPLE
      publish:
        description: 'Confirm Sheet and guide reviewed; commit validated snapshot'
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'new-laxmi-rate/**'
      - '.github/workflows/new-laxmi-rate-demo.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'gis-site-selection' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test catalogue validation
        run: python -m unittest discover -s new-laxmi-rate -p 'test_*.py'
      - name: Install read-only Google client
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install google-auth requests
      - name: Validate or refresh catalogue snapshot
        env:
          PRODUCTS_CSV: ${{ github.event_name == 'workflow_dispatch' && inputs.products_csv || '' }}
          CATALOGUE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.catalogue_mode || 'SAMPLE' }}
          REQUIRE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          LAXMI_SHEETS_CREDENTIALS: ${{ github.event_name == 'workflow_dispatch' && secrets.LAXMI_SHEETS_CREDENTIALS || '' }}
          LAXMI_SHEET_ID: ${{ vars.LAXMI_SHEET_ID }}
        run: python new-laxmi-rate/refresh.py
      - name: JavaScript syntax check
        run: node --check new-laxmi-rate/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: new-laxmi-store-catalogue
          path: new-laxmi-rate/catalogue.json
      - name: Update published branch snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-laxmi-rate/catalogue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh reviewed New Laxmi Store catalogue"
          git push origin HEAD:gis-site-selection
          echo "Snapshot committed. Branch-based Pages may require a separate deployment trigger; reconcile main after publication." >> "$GITHUB_STEP_SUMMARY"
