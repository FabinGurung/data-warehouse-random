name: Preserve Sandbox legacy source archive
on:
  push:
    branches: [gis-site-selection]
    paths: ['.github/workflows/preserve-sandbox-legacy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact legacy files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandbox-legacy"
          git archive 852f08badc9db194d00e3aa037102829b92a718f source/Pilates_Studio_Business_Management_System.xlsx docs/previews docs/BENCHMARK_NOTES.md docs/GITHUB_PAGES_DEPLOYMENT.md START_HERE.txt .github/workflows/archive-retired-trials.yml source-gallery.js | tar -x -C "$RUNNER_TEMP/sandbox-legacy"
          cd "$RUNNER_TEMP/sandbox-legacy"
          printf '%s\n' 'Repository: FabinGurung/data-warehouse-random' 'Source commit: 852f08badc9db194d00e3aa037102829b92a718f' 'Original bytes and paths, non-runtime archive.' > PROVENANCE.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-legacy-source-20261125
          path: ${{ runner.temp }}/sandbox-legacy/
          include-hidden-files: true
          retention-days: 30
