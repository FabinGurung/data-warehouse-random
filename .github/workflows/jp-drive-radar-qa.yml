name: JP Source Folder Tree and Trial Gallery — QA
on:
  push:
    branches:
      - gis-site-selection
    paths:
      - 'jp-drive-explorer/**'
      - 'jp-trials/**'
      - '.github/workflows/jp-drive-radar-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Read versioned folder-tree source
        uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Light-tree syntax, source manifest and navigation QA
        run: node jp-drive-explorer/qa/verify.mjs
      - name: Verify archived trials and draggable 3D gallery
        run: node jp-trials/qa/verify.mjs
      - name: Preserve independent original prototype
        run: |
          test -s index.html
          test -s data/site-data.js
          test -s jp-drive-explorer/index.html
