name: JP Document Tree — QA
on:
  push:
    branches: [gis-site-selection]
    paths:
      - 'jp-drive-explorer/**'
      - 'jp-trials/**'
      - 'source-gallery.js'
      - 'index.html'
      - '.github/workflows/jp-drive-radar-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node jp-drive-explorer/qa/verify.mjs
