name: JP Spider Radar — Public Directory QA
on:
  push:
    branches:
      - gis-site-selection
    paths:
      - 'jp-drive-explorer/**'
      - '.github/workflows/jp-drive-radar-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Read versioned radar source
        uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check jp-drive-explorer/radar.js
      - name: Manifest and navigation QA
        run: node jp-drive-explorer/qa/verify.mjs
      - name: Preserve independent original prototype
        run: |
          test -s index.html
          test -s data/site-data.js
          test -s jp-drive-explorer/index.html
