name: New Laxmi Store browser and live release QA
on:
  push:
    branches: [gis-site-selection]
    paths: ['new-laxmi-rate/**', '.github/workflows/laxmi-browser-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test local release in Chromium
        run: |
          mkdir -p qa-output
          python -m http.server 8765 > /tmp/laxmi-http.log 2>&1 &
          sleep 2
          node new-laxmi-rate/browser-qa.cjs http://127.0.0.1:8765/new-laxmi-rate/ local
      - name: Verify actual live Pages release in Chromium
        run: node new-laxmi-rate/browser-qa.cjs https://fabingurung.github.io/data-warehouse-random/new-laxmi-rate/ live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laxmi-browser-qa-screenshots
          path: qa-output/
